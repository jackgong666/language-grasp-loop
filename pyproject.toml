[project]
name = "language-grasp-loop"
version = "0.1.0"
description = "Language-conditioned grasp loop: a linear grounder plus closed-loop planar execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jack Gong" }]
keywords = ["robotics", "embodied-ai", "manipulation", "vision-language-action"]

[project.scripts]
language-grasp = "language_grasp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
